<form class="form" [formGroup]="registrationForm" (ngSubmit)="registration()">
  <h1 class="text-center">Register To</h1>
  <span class="text-uppercase">ManageMe App</span>
  <mat-form-field class="field">
    <mat-label>First Name</mat-label>
    <input matInput formControlName="firstName" />
    <mat-error class="error"> First Name is required </mat-error>
  </mat-form-field>
  <mat-form-field class="field">
    <mat-label>Last Name</mat-label>
    <input matInput formControlName="lastName" />
    <mat-error class="error"> Last Name is required </mat-error>
  </mat-form-field>
  <mat-form-field class="field" appearance="fill">
    <mat-label>Email</mat-label>
    <input
      type="email"
      matInput
      required
      placeholder="Ex. pat@example.com"
      formControlName="login"
    />
    <mat-error *ngIf="registrationForm.controls.login.hasError('required')" class="error"
      >Login is required</mat-error
    >
    <mat-error *ngIf="registrationForm.controls.login.hasError('email')" class="error">
      Please enter a valid login address
    </mat-error>
  </mat-form-field>
  <mat-form-field class="field">
    <mat-label>Password</mat-label>
    <input type="password" minlength="6" matInput required formControlName="password" />
    <mat-error *ngIf="registrationForm.controls.password.hasError('required')"
      >New Password is required</mat-error
    >
    <mat-error *ngIf="registrationForm.controls.password.hasError('minlength')">
      Password must be at least 6 characters long
    </mat-error>
  </mat-form-field>
  <div class="example-button-row">
    <button mat-raised-button type="submit" color="warn" class="button">SIGN UP</button>
  </div>
</form>
