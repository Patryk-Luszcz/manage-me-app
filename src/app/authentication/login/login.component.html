<form class="form" [formGroup]="loginForm" (ngSubmit)="login()">
  <h1 class="text-center">Login to</h1>
  <span class="text-uppercase">ManageMe App</span>
  <mat-form-field class="field" appearance="fill">
    <mat-label>Enter your login</mat-label>
    <input type="login" matInput formControlName="login" placeholder="Ex. pat@example.com" />
    <mat-error *ngIf="loginForm.controls.login.hasError('required')" class="error"
      >Login is required</mat-error
    >
    <mat-error *ngIf="loginForm.controls.login.hasError('email')" class="error">
      Please enter a valid login address
    </mat-error>
  </mat-form-field>
  <mat-form-field class="field" appearance="fill">
    <mat-label>Enter your password</mat-label>
    <input type="password" minlength="6" matInput formControlName="password" />
    <mat-error *ngIf="loginForm.controls.password.hasError('required')"
      >New Password is required</mat-error
    >
    <mat-error *ngIf="loginForm.controls.password.hasError('minlength')">
      Password must be at least 6 characters long
    </mat-error>
  </mat-form-field>
  <a class="create" [routerLink]="'/registration'"> Sign up here!</a>
  <div class="example-button-row">
    <button mat-raised-button type="submit" class="button">SIGN IN</button>
  </div>
</form>
